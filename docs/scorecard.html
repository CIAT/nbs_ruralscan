<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NbS Comparison Scorecard</title>
<meta name="description" content="Dashboard chips generated from the T3/T6 evidence: one chip per T5 theme, a hazard block and a count strip per NbS, with TTL priority weights (decisions D3–D7).">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-primary: #0b0f19;
    --bg-secondary: #131c2e;
    --bg-tertiary: #1e293b;
    --border-color: rgba(255, 255, 255, 0.08);
    --text-primary: #f8fafc;
    --text-secondary: #94a3b8;
    --text-muted: #64748b;
    --accent-emerald: #10b981;
    --accent-sky: #0ea5e9;
    --accent-amber: #f59e0b;
    --accent-rose: #f43f5e;
    --pill-done-bg: rgba(16, 185, 129, 0.18);
    --pill-done-fg: #34d399;
    --pill-prog-bg: rgba(245, 158, 11, 0.18);
    --pill-prog-fg: #fbbf24;
    --pill-none-bg: rgba(148, 163, 184, 0.12);
    --pill-none-fg: #94a3b8;
    --t3-bg: #4a3010;
    --t3-fg: #fbe3bd;
    --t6-bg: #4a1a2c;
    --t6-fg: #f8d3e0;
    --font-outfit: 'Outfit', sans-serif;
    --font-inter: 'Inter', sans-serif;
    --radius-md: 8px;
    --radius-sm: 4px;
  }
  /* Light theme: explicit toggle, or OS preference when no explicit choice */
  :root[data-theme="light"] {
    --bg-primary: #f8fcfb;
    --bg-secondary: #ffffff;
    --bg-tertiary: #f1f5f9;
    --border-color: rgba(0, 0, 0, 0.08);
    --text-primary: #0f172a;
    --text-secondary: #475569;
    --text-muted: #64748b;
    --accent-emerald: #059669;
    --accent-sky: #0284c7;
    --accent-amber: #d97706;
    --accent-rose: #e11d48;
    --pill-done-bg: #e1f5ee;
    --pill-done-fg: #085041;
    --pill-prog-bg: #fdf0d5;
    --pill-prog-fg: #8a4b06;
    --pill-none-bg: #eef1f4;
    --pill-none-fg: #64748b;
    --t3-bg: #faeeda;
    --t3-fg: #633806;
    --t6-bg: #fbeaf0;
    --t6-fg: #72243e;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg-primary: #f8fcfb;
      --bg-secondary: #ffffff;
      --bg-tertiary: #f1f5f9;
      --border-color: rgba(0, 0, 0, 0.08);
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --text-muted: #64748b;
      --accent-emerald: #059669;
      --accent-sky: #0284c7;
      --accent-amber: #d97706;
      --accent-rose: #e11d48;
      --pill-done-bg: #e1f5ee;
      --pill-done-fg: #085041;
      --pill-prog-bg: #fdf0d5;
      --pill-prog-fg: #8a4b06;
      --pill-none-bg: #eef1f4;
      --pill-none-fg: #64748b;
      --t3-bg: #faeeda;
      --t3-fg: #633806;
      --t6-bg: #fbeaf0;
      --t6-fg: #72243e;
    }
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background-color: var(--bg-primary); color: var(--text-primary); font-family: var(--font-inter); font-size: 14px; line-height: 1.5; min-height: 100vh; }
  a { color: var(--accent-sky); }
  .wrap { max-width: 1400px; margin: 0 auto; padding: 0 16px 48px; }
  header { padding: 18px 0 8px; display: flex; flex-wrap: wrap; gap: 12px; align-items: baseline; }
  h1 { font-family: var(--font-outfit); font-size: 22px; }
  .muted { color: var(--text-secondary); font-size: 12px; }
  .btn { background: var(--bg-tertiary); color: var(--text-primary); border: 1px solid var(--border-color); border-radius: var(--radius-sm); padding: 4px 10px; cursor: pointer; font: inherit; }
  .card { background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 12px 14px; margin: 10px 0; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--text-secondary); }
  .scroll { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; min-width: 760px; }
  th, td { border-bottom: 1px solid var(--border-color); padding: 6px 8px; text-align: center; vertical-align: middle; }
  th { font-size: 12px; color: var(--text-secondary); font-weight: 600; }
  th.grp { border-bottom: 2px solid var(--border-color); }
  td.nbs { text-align: left; font-weight: 600; cursor: pointer; white-space: nowrap; }
  td.nbs:hover { color: var(--accent-sky); }
  .chip { display: inline-flex; align-items: center; gap: 4px; min-width: 44px; justify-content: center; padding: 2px 8px; border-radius: 12px; font-weight: 700; background: var(--pill-none-bg); color: var(--text-primary); border: 1px solid transparent; white-space: nowrap; }
  .chip.pos { background: var(--pill-done-bg); color: var(--pill-done-fg); }
  .chip.neg { background: rgba(244, 63, 94, 0.16); color: var(--accent-rose); }
  .chip.dis { background: rgba(14, 165, 233, 0.14); color: var(--accent-sky); }
  .chip.caution { border-color: var(--accent-amber); }
  .cwrap { display: inline-flex; flex-direction: column; align-items: center; gap: 2px; }
  .conf { font-size: 10.5px; color: var(--text-secondary); letter-spacing: 0.02em; white-space: nowrap; }
  .counts { font-size: 12px; color: var(--text-secondary); text-align: left; white-space: nowrap; }
  .detail h2 { font-family: var(--font-outfit); font-size: 17px; margin-bottom: 6px; }
  .detail td, .detail th { text-align: left; }
  select { background: var(--bg-tertiary); color: var(--text-primary); border: 1px solid var(--border-color); border-radius: var(--radius-sm); font: inherit; padding: 1px 4px; }
  .evid { font-size: 12px; color: var(--text-secondary); margin-top: 8px; }
  code { font-size: 11px; color: var(--text-muted); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>NbS comparison scorecard</h1>
    <span class="muted" id="stamp"></span>
    <a href="index.html" class="muted">← site home</a>
    <button class="btn" id="theme-toggle" type="button">◐ Theme</button>
  </header>
  <div class="card">
    <p class="muted" id="rule"></p>
    <div class="legend" id="legend"></div>
  </div>
  <div class="card scroll"><table id="matrix"></table></div>
  <div class="card detail" id="detail"><p class="muted">Click a chip to see the evidence rows behind it.</p></div>
</div>
<script>
(function () {
  'use strict';
  var D = null, TTL = {}, OPEN = '';
  var CONF = ['very_low', 'low', 'medium', 'high', 'very_high'];
  function el(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function words(s) { return String(s || '').replace(/_/g, ' '); }
  // symbol = effect size (1:1 with the evidence class); confidence sits UNDER the pill
  function chipHtml(c, title) {
    var cls = c.rank > 0 ? 'pos' : c.rank < 0 ? 'neg' : c.glyph === '±' ? 'dis' : '';
    var t = title || ((c.class_label || c.label || words(c['class'])) + (c.confidence ? ' · ' + words(c.confidence) + ' confidence' : '') + (c.caution ? ' · CAUTION: measured harm for some adopters' : ''));
    var conf = c.dots ? '<span class="conf" title="' + esc(words(c.confidence) + ' confidence') + '">' + esc(c.dots) + ' ' + esc(c.badge === 'MED' ? 'medium' : String(c.badge || '').toLowerCase()) + '</span>' : '<span class="conf">&nbsp;</span>';
    return '<span class="cwrap"><span class="chip ' + cls + (c.caution ? ' caution' : '') + '" title="' + esc(t) + '">' + esc(c.glyph) + '</span>' + conf + '</span>';
  }
  function render() {
    var nbs = Object.keys(D.nbs), first = D.nbs[nbs[0]].rows, h = '<tr><th></th>' + nbs.map(function (n) { return '<th>' + esc(words(n)) + '</th>'; }).join('') + '</tr>';
    var panel = '';
    first.forEach(function (r, i) {
      if (r.panel !== panel) { panel = r.panel; h += '<tr><th class="grp" style="text-align:left" colspan="' + (nbs.length + 1) + '">' + esc(r.panel_label) + '</th></tr>'; }
      h += '<tr><td class="nbs" style="cursor:default">' + esc(r.label) + '</td>' + nbs.map(function (n) {
        return '<td><a href="#" class="cell" data-n="' + esc(n) + '" data-i="' + i + '" style="text-decoration:none">' + chipHtml(D.nbs[n].rows[i]) + '</a></td>';
      }).join('') + '</tr>';
    });
    h += '<tr><td class="counts">count strip</td>' + nbs.map(function (n) {
      var c = D.nbs[n].counts, bits = [];
      [['benefit', 'benefit'], ['harm', 'harm'], ['no_effect', 'no effect'], ['conflicting_evidence', 'disagree'], ['data_deficient', 'too thin'], ['not_assessed', 'n/a']].forEach(function (k) { if (c[k[0]]) bits.push(c[k[0]] + ' ' + k[1]); });
      return '<td class="counts">' + esc(bits.join(' · ')) + '</td>';
    }).join('') + '</tr>';
    el('matrix').innerHTML = h;
  }
  function renderDetail(n, i) {
    var r = D.nbs[n].rows[i];
    var src = (r.sources || []).map(function (x) {
      return '<tr><td><code>' + esc(x.source) + '</code></td><td>' + chipHtml(x) + '</td><td>' + esc(words(x['class'])) + '</td><td><code>' + esc(x.record_id) + '</code></td></tr>';
    }).join('');
    el('detail').innerHTML = '<h2>' + esc(words(n)) + ' · ' + esc(r.label) + '</h2><p>' + chipHtml(r) + ' ' + esc(r.class_label || words(r['class'])) + (r.why ? ' — ' + esc(r.why) : '') + '</p>' +
      '<div class="scroll"><table><tr><th>Evidence row</th><th>Chip</th><th>Class</th><th>Record</th></tr>' + src + '</table></div>' +
      '<p class="evid"><b>Evidenced priorities</b> (optional hotspot-map filter, D5): ' + esc(D.nbs[n].evidenced_priorities.map(words).join(', ') || 'none') + '</p>';
  }
  function legend() {
    var seen = {}, items = [];
    D.meta.scale.forEach(function (r) { if (!seen[r.glyph]) { seen[r.glyph] = 1; items.push('<span><b>' + esc(r.glyph) + '</b> ' + esc(r.label) + '</span>'); } });
    items.push('<span><b>●●● / ●●○ / ●○○</b> confidence (high / medium / low), shown under the symbol — it is how sure, not how big</span>', '<span><span class="chip caution">+</span> amber outline = CAUTION: measured harm for some adopters</span>');
    el('legend').innerHTML = items.join('');
    el('rule').textContent = 'One response chip per problem row (mockup rows; no theme chips, no NbS number). Pooled rows: ' + D.meta.pooled_row_rule + '. Fire is a project risk and production gap an intermediate step, so neither has a row. Decisions: ' + D.meta.decisions + '.';
    el('stamp').textContent = 'data as of ' + String((D.build || {}).timestamp || '').slice(0, 10) + ' · ' + ((D.build || {}).git_commit || '');
  }
  el('matrix').addEventListener('click', function (e) { var t = e.target.closest ? e.target.closest('a.cell') : null; if (t) { e.preventDefault(); renderDetail(t.getAttribute('data-n'), +t.getAttribute('data-i')); } });
  el('theme-toggle').addEventListener('click', function () {
    var r = document.documentElement, cur = r.getAttribute('data-theme') || ((window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark');
    var next = cur === 'light' ? 'dark' : 'light'; r.setAttribute('data-theme', next);
    try { localStorage.setItem('scorecardTheme', next); } catch (x) { /* ignore */ }
  });
  try { var sv = localStorage.getItem('scorecardTheme'); if (sv) document.documentElement.setAttribute('data-theme', sv); } catch (x) { /* ignore */ }
  fetch('scorecard.json', { cache: 'no-cache' }).then(function (r) { return r.json(); }).then(function (d) { D = d; legend(); render(); })
    .catch(function (e) { el('matrix').innerHTML = '<tr><td>Could not load scorecard.json: ' + esc(e.message) + '</td></tr>'; });
})();
</script>
</body>
</html>
